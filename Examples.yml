name: Examples
include:
  - xcodegen/Examples.yml
packages:
  MapboxMaps:
    path: .
targets:
  Examples:
    settings:
      base:
        MAPBOXMAPS_PATH: ./
    scheme:
      testPlans:
        - path: Tests/TestPlans/LoadTests.xctestplan
          defaultPlan: true
        - path: Tests/TestPlans/SearchUITests.xctestplan

targetTemplates:
  map-library:REPLACE:
    dependencies:
      - package: MapboxMaps

  maps-dependencies:
    dependencies:
